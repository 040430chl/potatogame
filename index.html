<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potato Reset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <div class="ambient ambient-left"></div>
    <div class="ambient ambient-right"></div>

    <main class="stage">
      <section class="panel welcome-panel is-active" data-screen="welcome">
        <div class="welcome-stack">
          <p class="eyebrow">Stress relief, reimagined</p>
          <div class="hello-frame" aria-live="polite">
            <span class="hello-word is-visible">안녕하세요</span>
            <span class="hello-word">Hello</span>
            <span class="hello-word">こんにちは</span>
            <span class="hello-word">Bonjour</span>
            <span class="hello-word">Guten Tag</span>
            <span class="hello-word">Hola</span>
          </div>
          <h1>감자를 던질 준비가 됐나요?</h1>
          <p class="lede">
            스트레스를 가볍게 털어내는, 미니멀한 한 판.
            사진 한 장으로 시작하는 세련된 데스크톱 플레이그라운드입니다.
          </p>
        </div>

        <div class="welcome-actions">
          <button class="primary-button" id="startButton" type="button">시작하기</button>
          <p class="support-copy">첫 버전에서는 업로드 흐름과 시작 경험부터 완성도 있게 다듬습니다.</p>
        </div>
      </section>

      <section class="panel setup-panel" data-screen="setup" aria-hidden="true">
        <div class="setup-copy">
          <p class="eyebrow">Step 1</p>
          <h2>오늘의 타겟을 올려주세요.</h2>
          <p>
            스트레스 받는 순간을 가볍게 전환할 수 있도록,
            인물 사진을 불러온 뒤 바로 미니게임으로 이어지게 설계합니다.
          </p>
        </div>

        <div class="setup-card">
          <label class="upload-dropzone" for="photoInput" id="dropzone">
            <input id="photoInput" type="file" accept="image/*" hidden>
            <div class="upload-idle" id="uploadIdle">
              <div class="icon-wrap" aria-hidden="true">
                <span class="icon-circle"></span>
                <span class="icon-plus">+</span>
              </div>
              <strong>사진 업로드</strong>
              <span>클릭해서 이미지를 선택하거나 파일을 끌어오세요.</span>
            </div>
            <div class="upload-preview" id="uploadPreview" hidden>
              <img id="previewImage" alt="업로드한 인물 사진 미리보기">
              <div class="preview-overlay">
                <span class="preview-chip">Ready</span>
                <strong id="fileName">portrait.jpg</strong>
              </div>
            </div>
          </label>

          <div class="meta-row">
            <label class="input-group">
              <span>세션 이름</span>
              <input id="sessionName" type="text" placeholder="예: 오후 3시 리셋">
            </label>
            <button class="secondary-button" id="launchButton" type="button">게임 시작</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
